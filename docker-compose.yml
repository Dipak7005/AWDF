# Practical 11: Containerization with Docker and Docker Compose
# CO5 / PO3, PO5

services:
  # 1. MongoDB Database Service
  mongodb:
    image: mongo:latest
    container_name: taskmanager-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      # Supplementary Problem 3: Named volume for data persistence across restarts
      - mongo-data:/data/db
    networks:
      - app-network

  # 2. Node/Express Backend API Service
  backend:
    build:
      context: ./task-manager-api
      dockerfile: Dockerfile
    container_name: taskmanager-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      # Step 5: Connecting to MongoDB using the service name 'mongodb'
      - MONGO_URI=mongodb://mongodb:27017/taskmanager
      - JWT_SECRET=supersecret_jwt_key_task_manager_2026
    depends_on:
      - mongodb
    networks:
      - app-network

  # 3. React Frontend Service
  frontend:
    build:
      context: ./task-manager-frontend
      dockerfile: Dockerfile
    container_name: taskmanager-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - app-network

# Internal Docker Bridge Network for inter-container communication
networks:
  app-network:
    driver: bridge

# Named Volume for MongoDB persistent storage
volumes:
  mongo-data:
    driver: local
