name: CI Pipeline

# Practical 12: CI/CD Pipeline with GitHub Actions
# CO5 / PO3, PO5

# Workflow triggers: Runs on push to main AND pull requests targeting main (Supplementary Problem 2)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Job 1: Linting Job (Supplementary Problem 1: Runs before the test job)
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'task-manager-frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./task-manager-frontend
        run: npm ci

      - name: Run Frontend Linter Check
        working-directory: ./task-manager-frontend
        run: npm run lint

      - name: Run Backend Syntax & Lint Check
        working-directory: ./task-manager-api
        run: npm run lint

  # Job 2: Build and Test Job
  build-and-test:
    name: Build & Run Automated Tests
    runs-on: ubuntu-latest
    needs: [lint] # Enforce lint job completes before testing starts
    defaults:
      run:
        working-directory: ./task-manager-api

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'task-manager-api/package-lock.json'

      - name: Install Backend Dependencies
        run: npm ci

      - name: Run Automated Jest Test Suite
        run: npm test
